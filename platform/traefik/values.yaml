# Minimal Traefik values for vCluster homelab
deployment:
  replicas: 1
service:
  type: LoadBalancer
ports:
  web:
    port: 80
    expose: true
  websecure:
    port: 443
    expose: false
providers:
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: false
logs:
  general:
    level: INFO
