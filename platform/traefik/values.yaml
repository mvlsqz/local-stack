# Minimal Traefik values for vCluster homelab
deployment:
  replicas: 1
service:
  type: LoadBalancer
ports:
  web:
    port: 80
    expose:
      default: true
    exposedPort: 80
  websecure:
    port: 443
    expose:
      default: false
    exposedPort: 443
    tls:
      enabled: false
providers:
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: false
logs:
  general:
    level: INFO
